name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.97.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy

      - name: Fetch locked Cargo dependencies
        shell: pwsh
        run: rustup run 1.97.0-x86_64-pc-windows-msvc cargo fetch --locked

      - name: Verify repository
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1
