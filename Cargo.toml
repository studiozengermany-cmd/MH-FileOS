[workspace]
members = [
    "apps/fileos-cli",
    "crates/fileos-domain",
    "crates/fileos-app",
    "crates/fileos-testkit",
    "crates/fileos-catalog",
    "crates/fileos-scanner",
    "crates/fileos-platform-windows",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
